
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0d1117;
            color: white;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 10%;
            background: #161b22;
        }

        header h2 {
            color: #58a6ff;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        nav a:hover {
            color: #58a6ff;
        }

        .hero {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .hero span {
            color: #58a6ff;
        }

        .hero p {
            color: #9da7b3;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .btn {
            background: #238636;
            color: white;
            padding: 13px 25px;
            border-radius: 8px;
            text-decoration: none;
        }

        .btn:hover {
            background: #2ea043;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #8b949e;
            background: #161b22;
        }
    </style>
</head>

<body>

    <header>
        <h2>MY WEBSITE</h2>

        <nav>
            <a href="#">Home</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Welcome to <span>My Website</span></h1>

        <p>
            Halo! Ini adalah website pertama saya.
            Dibuat menggunakan HTML, CSS, dan JavaScript.
        </p>

        <a href="#about" class="btn">Explore More</a>
    </section>

    <section id="about" class="hero">
        <h1>About Me</h1>
        <p>Saya sedang belajar membuat website menggunakan GitHub.</p>
    </section>

    <footer id="contact">
        <p>© 2026 My Website. All Rights Reserved.</p>
    </footer>

</body>
</html>
